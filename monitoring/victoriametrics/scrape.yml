# Targets VictoriaMetrics scrapes itself, so no Prometheus or agent is needed.
# %{METRICS_TOKEN} is substituted by VictoriaMetrics from its environment.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: app
    metrics_path: /api/metrics
    authorization:
      credentials: "%{METRICS_TOKEN}"
    static_configs:
      - targets: ["app:3000"]

  # Redis memory, keys, evictions, hit rate.
  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Host CPU, memory and load, plus Vector's own throughput.
  - job_name: vector
    static_configs:
      - targets: ["vector:9598"]

  # The monitoring services themselves, mostly for their memory against the budget.
  - job_name: victoriametrics
    static_configs:
      - targets: ["localhost:8428"]
  - job_name: victorialogs
    static_configs:
      - targets: ["victorialogs:9428"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
