services:
  app:
    build:
      context: .
    image: vpf-page
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
