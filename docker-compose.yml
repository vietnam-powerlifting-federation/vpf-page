services:
  app:
    build:
      context: .
      secrets:
        - database_url
    image: vpf-page
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:

# Passed to the build stage only, so nuxt's prerender step can read meet slugs
# from the database. Sourced from DATABASE_URL (loaded from .env by Compose).
secrets:
  database_url:
    environment: DATABASE_URL
