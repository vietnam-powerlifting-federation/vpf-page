services:
  app:
    build:
      context: .
      secrets:
        - database_url
    image: vpf-page
    env_file: .env
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    # `noeviction` is not optional: cached meets, records and results are written
    # without a TTL and are only meant to leave on an explicit invalidation. Any
    # `allkeys-*` policy would drop them under memory pressure and the app would
    # quietly serve nothing but misses.
    #
    # Appendonly keeps the cache across a restart. Losing it is survivable — the
    # next request rebuilds — but rebuilding means replaying the full results
    # query, so it is worth persisting.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:

# Passed to the build stage only, so nuxt's prerender step can read meet slugs
# from the database. Sourced from DATABASE_URL (loaded from .env by Compose).
secrets:
  database_url:
    environment: DATABASE_URL
